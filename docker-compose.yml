services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ac-predictor-backend
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/ac_predictor.db
      MODEL_PATH: /app/ml/models/ac_failure_model.joblib
      METRICS_PATH: /app/ml/models/model_evaluation.json
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      IN_PROCESS_SIMULATOR: "false"
      AUTO_TRAIN_IF_MISSING: "true"
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ac-predictor-simulator
    env_file:
      - .env
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "simulator.sensor_generator", "--api-url", "http://backend:8000"]
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ac-predictor-dashboard
    env_file:
      - .env
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    command:
      [
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.port=8501",
        "--server.address=0.0.0.0",
        "--server.headless=true"
      ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
